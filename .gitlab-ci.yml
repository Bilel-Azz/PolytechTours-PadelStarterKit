# GitLab CI/CD Pipeline pour Padel Corpo
# Ce fichier automatise les tests du backend Node.js, frontend Vue.js et backend Python

stages:
  - install
  - test
  - build

# Variables globales
variables:
  NODE_VERSION: "18"
  PYTHON_VERSION: "3.11"
  CACHE_COMPRESSION_LEVEL: "fast"

# Template de cache pour Node.js
.node_cache: &node_cache
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull

# Template de cache pour Python
.python_cache: &python_cache
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .venv/
      - .pip-cache/
    policy: pull

# ================================
# 🔧 INSTALLATION DES DÉPENDANCES
# ================================

install:backend:node:
  stage: install
  image: node:${NODE_VERSION}-alpine
  before_script:
    - cd backend
  script:
    - npm ci --cache .npm --prefer-offline
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - backend/node_modules/
      - backend/.npm/
    policy: pull-push
  artifacts:
    paths:
      - backend/node_modules/
    expire_in: 1 hour
  only:
    changes:
      - backend/**/*
      - .gitlab-ci.yml

install:frontend:
  stage: install
  image: node:${NODE_VERSION}-alpine
  before_script:
    - cd frontend
  script:
    - npm ci --cache .npm --prefer-offline
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
      - frontend/.npm/
    policy: pull-push
  artifacts:
    paths:
      - frontend/node_modules/
    expire_in: 1 hour
  only:
    changes:
      - frontend/**/*
      - .gitlab-ci.yml

install:backend:python:
  stage: install
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - cd backend_python
  script:
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install --cache-dir=.pip-cache -r requirements.txt
  cache:
    key:
      files:
        - backend_python/requirements.txt
    paths:
      - backend_python/.venv/
      - backend_python/.pip-cache/
    policy: pull-push
  artifacts:
    paths:
      - backend_python/.venv/
    expire_in: 1 hour
  only:
    changes:
      - backend_python/**/*
      - .gitlab-ci.yml

# ================================
# 🧪 TESTS
# ================================

test:backend:node:unit:
  stage: test
  image: node:${NODE_VERSION}-alpine
  needs:
    - install:backend:node
  dependencies:
    - install:backend:node
  before_script:
    - cd backend
  script:
    - npm run test:unit
  artifacts:
    when: always
    paths:
      - backend/coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage/cobertura-coverage.xml
    expire_in: 30 days
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  only:
    changes:
      - backend/**/*
      - .gitlab-ci.yml

test:backend:node:integration:
  stage: test
  image: node:${NODE_VERSION}-alpine
  needs:
    - install:backend:node
  dependencies:
    - install:backend:node
  before_script:
    - cd backend
  script:
    - npm run test:integration
  only:
    changes:
      - backend/**/*
      - .gitlab-ci.yml

test:backend:node:coverage:
  stage: test
  image: node:${NODE_VERSION}-alpine
  needs:
    - install:backend:node
  dependencies:
    - install:backend:node
  before_script:
    - cd backend
  script:
    - npm run test -- --coverage --coverageReporters=text --coverageReporters=lcov --coverageReporters=cobertura
  artifacts:
    when: always
    paths:
      - backend/coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage/cobertura-coverage.xml
    expire_in: 30 days
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  only:
    changes:
      - backend/**/*
      - .gitlab-ci.yml

test:frontend:unit:
  stage: test
  image: node:${NODE_VERSION}-alpine
  needs:
    - install:frontend
  dependencies:
    - install:frontend
  before_script:
    - cd frontend
  script:
    # Pour l'instant, pas de tests unitaires configurés
    # Ajouter vitest ou jest si nécessaire
    - echo "Pas de tests unitaires frontend configurés pour le moment"
  only:
    changes:
      - frontend/**/*
      - .gitlab-ci.yml
  allow_failure: true

test:frontend:e2e:
  stage: test
  image: cypress/browsers:node18.12.0-chrome107
  needs:
    - install:frontend
  dependencies:
    - install:frontend
  before_script:
    - cd frontend
  script:
    # Installation de Cypress si nécessaire
    - npx cypress install
    # Démarrage du serveur de dev en arrière-plan
    - npm run dev &
    - sleep 10  # Attendre que le serveur démarre
    # Exécution des tests Cypress
    - npx cypress run --browser chrome
  artifacts:
    when: always
    paths:
      - frontend/cypress/videos/
      - frontend/cypress/screenshots/
    expire_in: 7 days
  only:
    changes:
      - frontend/**/*
      - .gitlab-ci.yml
  allow_failure: true

test:backend:python:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  needs:
    - install:backend:python
  dependencies:
    - install:backend:python
  before_script:
    - cd backend_python
    - source .venv/bin/activate
  script:
    # Si vous avez pytest configuré
    - |
      if [ -f "pytest.ini" ] || [ -f "tests/__init__.py" ]; then
        pip install pytest pytest-cov
        pytest --cov=app --cov-report=xml --cov-report=term
      else
        echo "Pas de tests Python configurés pour le moment"
      fi
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend_python/coverage.xml
    expire_in: 30 days
  only:
    changes:
      - backend_python/**/*
      - .gitlab-ci.yml
  allow_failure: true

# ================================
# 🏗️ BUILD
# ================================

build:frontend:
  stage: build
  image: node:${NODE_VERSION}-alpine
  needs:
    - install:frontend
    - test:frontend:unit
  dependencies:
    - install:frontend
  before_script:
    - cd frontend
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 7 days
  only:
    changes:
      - frontend/**/*
      - .gitlab-ci.yml

# ================================
# 📊 RÉSUMÉ DES TESTS (optionnel)
# ================================

test:summary:
  stage: test
  image: alpine:latest
  needs:
    - test:backend:node:coverage
  script:
    - echo "Tests terminés avec succès ✅"
    - echo "Consultez les rapports de couverture dans les artifacts"
  when: on_success
  only:
    changes:
      - backend/**/*
      - frontend/**/*
      - backend_python/**/*
      - .gitlab-ci.yml
