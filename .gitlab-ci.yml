# GitLab CI/CD Pipeline pour Padel Corpo
# Ce fichier automatise les tests du backend Node.js, frontend Vue.js et backend Python

stages:
  - install
  - test
  - build

# Variables globales
variables:
  NODE_VERSION: "18"
  CACHE_COMPRESSION_LEVEL: "fast"

# Template de cache pour Node.js
.node_cache: &node_cache
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull



# ================================
# 🔧 INSTALLATION DES DÉPENDANCES
# ================================

install:backend:node:
  stage: install
  image: node:${NODE_VERSION}-alpine
  before_script:
    - cd backend
  script:
    - npm ci --cache .npm --prefer-offline
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - backend/node_modules/
      - backend/.npm/
    policy: pull-push
  artifacts:
    paths:
      - backend/node_modules/
    expire_in: 1 hour
  only:
    changes:
      - backend/**/*
      - .gitlab-ci.yml

install:frontend:
  stage: install
  image: node:${NODE_VERSION}-alpine
  before_script:
    - cd frontend
  script:
    - npm ci --cache .npm --prefer-offline
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
      - frontend/.npm/
    policy: pull-push
  artifacts:
    paths:
      - frontend/node_modules/
    expire_in: 1 hour
  only:
    changes:
      - frontend/**/*
      - .gitlab-ci.yml



# ================================
# 🧪 TESTS
# ================================

test:backend:node:unit:
  stage: test
  image: node:${NODE_VERSION}-alpine
  needs:
    - install:backend:node
  dependencies:
    - install:backend:node
  before_script:
    - cd backend
  script:
    - npm run test:unit
  artifacts:
    when: always
    paths:
      - backend/coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage/cobertura-coverage.xml
    expire_in: 30 days
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  only:
    changes:
      - backend/**/*
      - .gitlab-ci.yml

test:backend:node:integration:
  stage: test
  image: node:${NODE_VERSION}-alpine
  needs:
    - install:backend:node
  dependencies:
    - install:backend:node
  before_script:
    - cd backend
  script:
    - npm run test:integration
  only:
    changes:
      - backend/**/*
      - .gitlab-ci.yml

test:backend:node:coverage:
  stage: test
  image: node:${NODE_VERSION}-alpine
  needs:
    - install:backend:node
  dependencies:
    - install:backend:node
  before_script:
    - cd backend
  script:
    - npm run test -- --coverage --coverageReporters=text --coverageReporters=lcov --coverageReporters=cobertura
  artifacts:
    when: always
    paths:
      - backend/coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage/cobertura-coverage.xml
    expire_in: 30 days
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  only:
    changes:
      - backend/**/*
      - .gitlab-ci.yml

test:frontend:unit:
  stage: test
  image: node:${NODE_VERSION}-alpine
  needs:
    - install:frontend
  dependencies:
    - install:frontend
  before_script:
    - cd frontend
  script:
    # Pour l'instant, pas de tests unitaires configurés
    # Ajouter vitest ou jest si nécessaire
    - echo "Pas de tests unitaires frontend configurés pour le moment"
  only:
    changes:
      - frontend/**/*
      - .gitlab-ci.yml
  allow_failure: true

test:frontend:e2e:
  stage: test
  image: cypress/browsers:node18.12.0-chrome107
  needs:
    - install:frontend
    - install:backend:node
  dependencies:
    - install:frontend
    - install:backend:node
  before_script:
    # Créer un fichier .env pour le backend
    - |
      cat > backend/.env <<EOF
      PORT=8000
      DATABASE_URL=sqlite:///padel_corpo.db
      SECRET_KEY=test_secret_key_for_ci_cd
      ALLOWED_ORIGINS=http://localhost:5173
      EOF
    # Démarrer le backend en arrière-plan
    - cd backend
    - node server.js > backend.log 2>&1 &
    - BACKEND_PID=$!
    - echo "Backend started with PID $BACKEND_PID"
    # Attendre que le backend soit prêt (max 30 secondes)
    - |
      echo "Waiting for backend to be ready..."
      for i in {1..30}; do
        if curl -s http://localhost:8000/health > /dev/null; then
          echo "Backend is ready!"
          break
        fi
        echo "Waiting for backend... ($i/30)"
        sleep 1
      done
    - cd ../frontend
  script:
    # Installation de Cypress si nécessaire
    - npx cypress install
    # Démarrage du serveur de dev frontend en arrière-plan
    - npm run dev > vite.log 2>&1 &
    - FRONTEND_PID=$!
    - echo "Frontend started with PID $FRONTEND_PID"
    # Attendre que le serveur frontend démarre (max 30 secondes)
    - |
      echo "Waiting for frontend to be ready..."
      for i in {1..30}; do
        if curl -s http://localhost:5173 > /dev/null; then
          echo "Frontend is ready!"
          break
        fi
        echo "Waiting for frontend... ($i/30)"
        sleep 1
      done
    # Exécution des tests Cypress
    - npx cypress run --browser chrome
  after_script:
    # Afficher les logs en cas d'erreur
    - echo "=== Backend logs ==="
    - cat backend/backend.log || echo "No backend logs"
    - echo "=== Frontend logs ==="
    - cat frontend/vite.log || echo "No frontend logs"
  artifacts:
    when: always
    paths:
      - frontend/cypress/videos/
      - frontend/cypress/screenshots/
      - backend/backend.log
      - frontend/vite.log
    expire_in: 7 days
  only:
    changes:
      - frontend/**/*
      - backend/**/*
      - .gitlab-ci.yml
  allow_failure: true



# ================================
# 🏗️ BUILD
# ================================

build:frontend:
  stage: build
  image: node:${NODE_VERSION}-alpine
  needs:
    - install:frontend
    - test:frontend:unit
  dependencies:
    - install:frontend
  before_script:
    - cd frontend
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 7 days
  only:
    changes:
      - frontend/**/*
      - .gitlab-ci.yml

# ================================
# 📊 RÉSUMÉ DES TESTS (optionnel)
# ================================

test:summary:
  stage: test
  image: alpine:latest
  needs:
    - job: test:backend:node:coverage
      optional: true
    - job: test:frontend:e2e
      optional: true
  script:
    - echo "Tests terminés avec succès ✅"
    - echo "Consultez les rapports de couverture dans les artifacts"
  when: on_success

